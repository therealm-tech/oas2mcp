default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --allow-multiple-documents
        # Helm templates are Go-templated, not plain YAML.
        exclude: ^charts/[^/]+/templates/
      - id: check-added-large-files
        exclude: ^(Cargo\.lock|docs/package-lock\.json)$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-taskfile

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        # Without it, warnings (`document-start` among them) pass the hook.
        args:
          - --strict
        exclude: ^charts/[^/]+/templates/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: no-co-authors
        name: no co-authors in commit message
        entry: '^\s*co-authored-by:|\bgenerated with\b'
        language: pygrep
        args:
          - --ignore-case
        stages:
          - commit-msg

      - id: mise-fmt
        name: mise fmt
        entry: mise fmt
        language: system
        files: ^mise\.toml$
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types:
          - rust
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types:
          - rust
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        types:
          - yaml
        files: ^\.github/workflows/

      - id: helm-lint
        name: helm lint
        entry: helm lint charts/oas2mcp -f charts/oas2mcp/values-lint.yaml
        language: system
        files: ^charts/oas2mcp/
        pass_filenames: false

      - id: helm-docs
        name: helm-docs
        entry: helm-docs --chart-search-root=charts
        language: system
        files: ^charts/.*/(values\.yaml|Chart\.yaml|README\.md(\.gotmpl)?)$
        pass_filenames: false

      # Named targets rather than `.`, which would also scan the Dockerfiles
      # npm packages ship under `docs/node_modules`. The chart is only checked
      # once rendered with `values-lint.yaml`; `.trivy/` holds the parameters.
      - id: trivy-config
        name: trivy config
        entry: >-
          bash -c 'for target in Dockerfile charts/oas2mcp; do
          trivy config --quiet --exit-code 1
          --helm-values charts/oas2mcp/values-lint.yaml --config-data .trivy "$target" || exit 1;
          done'
        language: system
        files: ^(Dockerfile|charts/oas2mcp/|\.trivy/|\.trivyignore$)
        pass_filenames: false

      # Biome from the docs site's own lockfile rather than biomejs/pre-commit,
      # whose `additional_dependencies` pin would be a second Biome version to
      # keep in step. Both hooks need `npm ci --prefix docs` first.
      - id: biome
        name: biome
        entry: npm --prefix docs run lint
        language: system
        files: ^docs/
        pass_filenames: false

      - id: astro-check
        name: astro check
        entry: npm --prefix docs run check
        language: system
        files: ^docs/
        pass_filenames: false

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # frozen: v2.15.1
    hooks:
      # `language: system` — needs the `hadolint` binary on PATH (installed in CI).
      - id: hadolint
        args:
          - --no-color
