---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates are Go-templated, not plain YAML.
        exclude: ^charts/.*/templates/
      - id: check-added-large-files
        exclude: ^docs/package-lock\.json$
      - id: check-merge-conflict
      - id: detect-private-key
        # Throwaway RSA and EC keys used only by the unit tests, never real
        # credentials. Scoped to these two fixtures so the hook stays armed
        # everywhere else.
        exclude: ^tests/fixtures/test_(rsa|ec)_key\.pem$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types:
          - rust
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types:
          - rust
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types:
          - shell

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        types:
          - yaml
        files: ^\.github/workflows/

      - id: helm-lint
        name: helm lint
        entry: helm lint charts/oas2mcp -f charts/oas2mcp/values-lint.yaml
        language: system
        files: ^charts/oas2mcp/
        pass_filenames: false

      - id: helm-docs
        name: helm-docs
        entry: helm-docs --chart-search-root=charts
        language: system
        files: ^charts/.*/(values\.yaml|Chart\.yaml|README\.md(\.gotmpl)?)$
        pass_filenames: false

      # Biome from the docs site's own lockfile rather than biomejs/pre-commit,
      # whose `additional_dependencies` pin would be a second Biome version to
      # keep in step. Both hooks need `npm ci --prefix docs` first.
      - id: biome
        name: biome
        entry: npm --prefix docs run lint
        language: system
        files: ^docs/
        pass_filenames: false

      - id: astro-check
        name: astro check
        entry: npm --prefix docs run check
        language: system
        files: ^docs/
        pass_filenames: false

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # `language: system` — needs the `hadolint` binary on PATH (installed in CI).
      - id: hadolint
        args:
          - --no-color
