# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

set:
  - errexit
  - nounset
  - pipefail

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install the documentation site dependencies and the git hooks
    deps:
      - docs:deps
    cmds:
      - pre-commit install

  lint:
    desc: Run every pre-commit hook on the whole repository
    deps:
      - docs:deps
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run the unit and in-process tests
    cmds:
      - cargo test --all --locked {{.CLI_ARGS}}

  coverage:
    desc: Run the unit, in-process and docs site tests and measure their coverage
    deps:
      - docs:deps
    cmds:
      - cargo llvm-cov --workspace --all-targets --locked {{.CLI_ARGS}}
      - cargo llvm-cov report --html
      - mkdir -p docs/coverage
      - npm --prefix docs run coverage | tee docs/coverage/summary.txt

  coverage:summary:
    desc: Print the summary of the last coverage run
    cmds:
      - cargo llvm-cov report
      - sed -n '/start of coverage report/,/end of coverage report/p' docs/coverage/summary.txt

  e2e:
    desc: Run the end-to-end suite against the Keycloak on localhost:8080
    cmds:
      - python3 -m pip install --quiet --requirement tests/e2e/requirements.txt
      - cargo build --locked
      - tests/e2e/harness.sh

  e2e:image:
    desc: Run the end-to-end suite against a container image (OAS2MCP_IMAGE=oas2mcp:e2e)
    # Not `IMAGE`: Task reads the environment as variables, and `build.yaml` sets
    # that one to the registry repository.
    vars:
      OAS2MCP_IMAGE: '{{.OAS2MCP_IMAGE | default "oas2mcp:e2e"}}'
    preconditions:
      - sh: docker image inspect {{.OAS2MCP_IMAGE}}
        msg: "no image {{.OAS2MCP_IMAGE}}: build it with `docker build -t {{.OAS2MCP_IMAGE}} .`"
    cmds:
      - python3 -m pip install --quiet --requirement tests/e2e/requirements.txt
      - OAS2MCP_IMAGE={{.OAS2MCP_IMAGE}} tests/e2e/harness.sh

  docs:
    desc: Build every version of the documentation site
    deps:
      - docs:deps
    cmds:
      - npm --prefix docs run build:versions

  docs:test:
    desc: Run the documentation site tests
    deps:
      - docs:deps
    cmds:
      - npm --prefix docs test

  docs:deps:
    internal: true
    sources:
      - docs/package-lock.json
    generates:
      - docs/node_modules/.package-lock.json
    cmds:
      - npm ci --prefix docs

  release:
    desc: Bump, commit and tag a release, then ask before pushing
    interactive: true
    cmds:
      - scripts/release.sh {{.CLI_ARGS}}
