name: build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build.yaml"
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to the registry.
        type: boolean
        default: false
      version:
        description: Image tag to publish (defaults to the short commit SHA).
        type: string
        default: ""
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      version:
        type: string
        default: ""

# The group name is hardcoded rather than `${{ github.workflow }}`: in a
# `workflow_call` run that expression resolves to the *caller* (`release`), so
# the reusable build would share a group with — and cancel — the very job
# waiting on it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/therealm-tech/oas2mcp

jobs:
  build:
    name: build (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
      # Publishing the SARIF report to the Security tab.
      security-events: write
    runs-on: ${{ matrix.runner }}
    # One native runner per architecture — never QEMU-emulate a Rust build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: compute image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build to a local tarball. Scan it, then push the very same bits — a
      # release must scan the artefact it publishes, and advisories move daily.
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-arch Docker layer cache: the expensive thing to recompute.
          cache-from: type=gha,scope=${{ matrix.arch }}
          # Saved from `main` only: every other ref restores it, and a pull
          # request saving its own would evict the one they all read.
          cache-to: >-
            ${{ github.ref == 'refs/heads/main'
            && format('type=gha,scope={0},mode=max', matrix.arch)
            || '' }}
          outputs: type=docker,dest=/tmp/image.tar

      # Two passes: report every severity to the Security tab, gate on HIGH and
      # CRITICAL. One pass cannot do both — a SARIF run ignores `severity`, so it
      # would fail the build on a LOW finding.
      - name: scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          input: /tmp/image.tar
          scanners: vuln,secret
          cache: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: publish the image findings
        # A pull request from a fork gets a read-only token and cannot upload.
        if: >-
          always() && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.arch }}

      - name: fail on high and critical findings
        # A finding fails this job, which blocks the `manifest` job below, so a
        # release pushes digests that no tag ever references.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          input: /tmp/image.tar
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          # Unfixed advisories are reported above but cannot be actioned here.
          ignore-unfixed: true
          cache: true
          format: table
          exit-code: "1"

      # Push only when releasing. The layer cache from the build above makes
      # this a cache hit, so the pushed digest is the image just scanned.
      - name: push the image
        id: build
        if: ${{ inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: export digest
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: manifest
    if: ${{ inputs.push }}
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-26.04
    steps:
      - name: download the per-arch digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' && !contains(inputs.version, '-') }}
            type=sha,enable=${{ inputs.version == '' }}

      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: inspect the manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: read the manifest digest
        id: digest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: attest the image provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: generate the SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56  # v0.24.4
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx-json
          output-file: oas2mcp-${{ steps.meta.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: oas2mcp-${{ steps.meta.outputs.version }}.cdx.json
          push-to-registry: true

      - name: name the attestation bundle after the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: cp "$BUNDLE" "oas2mcp-${VERSION}.sigstore.json"

      # Picked up by the `release` workflow, which attaches them to the GitHub
      # Release.
      - name: upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: |
            oas2mcp-*.cdx.json
            oas2mcp-*.sigstore.json
          if-no-files-found: error
