name: quality

on:
  push:
    branches:
      - main
  pull_request:

# One quality run per ref: a new push supersedes the one still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: install the tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.10
          cache: false

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: run pre-commit
        run: task lint

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: install the tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.10
          cache: false
          install_args: rust task

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: run the test suite
        run: task test

  docs-test:
    name: docs-test
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: install the tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.10
          cache: false
          install_args: node task

      - name: run the docs site tests
        run: task docs:test

  # What the unit tests cannot answer is whether a real authorization server
  # accepts what we send. This drives the RFC 7523 paths against Keycloak:
  # `private_key_jwt` client authentication (§2.2) for the document fetch, and the
  # `jwt-bearer` grant (§2.1) relaying a caller's assertion for a per-caller
  # upstream token.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    services:
      # `command` is what makes this possible: the Keycloak image has no default
      # CMD, so without it the container prints its usage and exits.
      keycloak:
        image: quay.io/keycloak/keycloak:26.7.4
        command: start-dev
        env:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        ports:
          - 8080:8080
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: install the tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.10
          cache: false
          install_args: python rust task

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The realm is imported through Keycloak's admin API rather than a mounted
      # file: a service container starts before the repository is checked out, so
      # there is nothing to mount at that point.
      - name: run the end-to-end suite
        run: task e2e
