name: quality

on:
  push:
    branches:
      - main
  pull_request:

# One quality run per ref: a new push supersedes the one still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the Rust toolchain
        run: rustup toolchain install

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: install helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin helm-docs

      - name: install shellcheck
        # Preinstalled on the ubuntu-24.04 image, but the hook must not depend
        # on that staying true.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint

      - name: install hadolint
        # The hook runs the binary on PATH and ignores its own `rev`, so the
        # version is read from there to keep the one Dependabot bumps in force.
        run: |
          HADOLINT_VERSION="$(yq '.repos[] | select(.repo == "https://github.com/hadolint/hadolint") | .rev | sub("^v"; "")' .pre-commit-config.yaml)"
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      - name: install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          # The version trivy-action runs in `security`: one Trivy, one ruleset.
          version: v0.70.0
          cache: true

      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: docs/.nvmrc

      - name: install the docs site dependencies
        run: npm ci --prefix docs

      - name: install pre-commit
        run: pipx install pre-commit

      - name: run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the Rust toolchain
        run: rustup toolchain install

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: run the test suite
        run: cargo test --all --locked

  docs-test:
    name: docs-test
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: docs/.nvmrc

      - name: install the docs site dependencies
        run: npm ci --prefix docs

      - name: run the docs site tests
        run: npm --prefix docs test

  # What the unit tests cannot answer is whether a real authorization server
  # accepts what we send. This drives the RFC 7523 paths against Keycloak:
  # `private_key_jwt` client authentication (§2.2) for the document fetch, and the
  # `jwt-bearer` grant (§2.1) relaying a caller's assertion for a per-caller
  # upstream token.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    services:
      # `command` is what makes this possible: the Keycloak image has no default
      # CMD, so without it the container prints its usage and exits.
      keycloak:
        image: quay.io/keycloak/keycloak:26.7.4
        command: start-dev
        env:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        ports:
          - 8080:8080
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the Rust toolchain
        run: rustup toolchain install

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: build oas2mcp
        run: cargo build --locked

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: install the harness dependencies
        run: pip install --requirement tests/e2e/requirements.txt

      # The realm is imported through Keycloak's admin API rather than a mounted
      # file: a service container starts before the repository is checked out, so
      # there is nothing to mount at that point.
      - name: run the end-to-end suite
        run: tests/e2e/harness.sh
