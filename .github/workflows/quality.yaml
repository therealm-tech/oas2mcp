name: quality

on:
  push:
    branches:
      - main
  pull_request:

# One quality run per ref: a new push supersedes the one still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the Rust toolchain
        run: rustup component add rustfmt clippy

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: install helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin helm-docs

      - name: install shellcheck
        # Preinstalled on the ubuntu-24.04 image, but the hook must not depend
        # on that staying true.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint

      - name: install hadolint
        env:
          HADOLINT_VERSION: "2.12.0"
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      - name: install pre-commit
        run: pipx install pre-commit

      - name: run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the Rust toolchain
        run: rustup component add clippy

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: run the test suite
        run: cargo test --all --locked

  # What the unit tests cannot answer is whether a real authorization server
  # accepts what we send. This drives the RFC 7523 paths against Keycloak:
  # `private_key_jwt` client authentication (§2.2) for the document fetch, and the
  # `jwt-bearer` grant (§2.1) relaying a caller's assertion for a per-caller
  # upstream token.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    services:
      # `command` is what makes this possible: the Keycloak image has no default
      # CMD, so without it the container prints its usage and exits.
      keycloak:
        image: quay.io/keycloak/keycloak:26.7
        command: start-dev
        env:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        ports:
          - 8080:8080
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install the Rust toolchain
        run: rustup component add clippy

      - name: cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: build oas2mcp
        run: cargo build --locked

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: install the harness dependencies
        run: pip install --requirement tests/e2e/requirements.txt

      # The realm is imported through Keycloak's admin API rather than a mounted
      # file: a service container starts before the repository is checked out, so
      # there is nothing to mount at that point.
      - name: run the end-to-end suite
        run: tests/e2e/harness.sh

  trivy:
    name: trivy
    permissions:
      contents: read
      # Publishing the SARIF report to the Security tab.
      security-events: write
    runs-on: ubuntu-24.04
    env:
      # Trivy renders the chart itself, but only once it has the values the
      # templates require. Without this it logs a render error and scans no
      # chart at all — while still reporting success.
      TRIVY_HELM_VALUES: charts/oas2mcp/values-lint.yaml
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Two passes on purpose. The Security tab gets everything actionable at
      # every severity; the build gate below only trips on HIGH/CRITICAL. One
      # pass cannot do both: `limit-severities-for-sarif` defaults to false, so
      # a SARIF run ignores `severity` and would fail the build on a LOW.
      - name: scan the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          # Advisories without a released fix are noise nobody can action;
          # they would bury the dashboard under the base image's backlog.
          ignore-unfixed: true
          # A throwaway RSA key used only by the auth unit tests, never a real
          # credential — `detect-private-key` skips it for the same reason.
          skip-files: tests/fixtures/test_rsa_key.pem
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: publish the findings
        # Only a fork or Dependabot pull request lacks the token to upload, and
        # both arrive as `pull_request`. Reporting happens from push events.
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43  # v4.37.5
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: fail on high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: tests/fixtures/test_rsa_key.pem
          format: table
          exit-code: "1"
