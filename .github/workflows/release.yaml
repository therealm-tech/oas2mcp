name: release

on:
  push:
    tags:
      - "v*"

# One release per ref: a newer run supersedes the one still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: derive the version from the tag
        id: v
        # Strip the leading `v` so the value is valid SemVer for the image.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: check the manifest version matches the tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # The tag drives the image tag, but `Cargo.toml` is what ends up in
        # `oas2mcp --version`. Let them drift and the released binary lies about
        # which release it is — so fail here, before anything gets published.
        # `scripts/release.sh` keeps the two aligned when cutting a release.
        run: |
          manifest="$(sed -n '/^\[package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p;}' Cargo.toml)"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Cargo.toml version is $manifest but the tag says $VERSION — bump Cargo.toml or retag."
            exit 1
          fi
          echo "Cargo.toml version $manifest matches tag $GITHUB_REF_NAME"

  build:
    name: build
    needs: version
    permissions:
      contents: read
      packages: write
      # The reusable build workflow uploads Trivy SARIF to the Security tab; a
      # reusable workflow can never exceed the permissions its caller grants.
      security-events: write
    uses: ./.github/workflows/build.yaml
    with:
      push: true
      version: ${{ needs.version.outputs.version }}

  github-release:
    name: github-release
    needs:
      - build
    # A pre-release tag (`v1.2.0-rc1`) publishes the image and stops there: an
    # rc exists to be tested, and a release page for it would carry the notes
    # the final release then repeats.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: find the previous stable release
        id: previous
        # The greatest `vX.Y.Z` below this one, ignoring pre-releases, so the
        # notes cover everything since the last stable release whatever rc
        # tags sit in between. Empty for the first release.
        run: |
          previous="$(git tag --list 'v*' | grep -v -e '-' | sort -uV | grep -x -B1 -e "$GITHUB_REF_NAME" | head -n1)"
          if [ "$previous" = "$GITHUB_REF_NAME" ]; then
            previous=""
          fi
          echo "tag=${previous}" >> "$GITHUB_OUTPUT"

      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          args=(--generate-notes --verify-tag)
          if [ -n "$PREVIOUS" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
