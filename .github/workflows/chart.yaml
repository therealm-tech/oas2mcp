name: chart

on:
  push:
    tags:
      - "chart-*"
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to publish (SemVer, no leading v).
        type: string
        required: true

# One publish per ref: a newer run supersedes the one still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_DIR: charts/oas2mcp
  OCI_REPO: oci://ghcr.io/therealm-tech/charts

jobs:
  publish:
    name: publish
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: install the tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.14
          cache: false
          install_args: helm

      - name: resolve the chart version
        id: v
        # From the `chart-X.Y.Z` tag, or the workflow_dispatch input.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#chart-}"
            version="${version#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: check the committed versions match
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # A stable chart is also what the README tells people to install.
        run: |
          committed="$(sed -n 's/^version:[[:space:]]*//p' "$CHART_DIR/Chart.yaml" | tr -d "\"'")"
          if [ "$committed" != "$VERSION" ]; then
            echo "::error::Chart.yaml version is $committed but the release says $VERSION. Cut chart releases with \`task release -- --chart\` so the two stay in step."
            exit 1
          fi
          if [[ "$VERSION" != *-* ]] && ! grep -qF "oas2mcp --version $VERSION " README.md; then
            echo "::error::README.md does not install chart $VERSION. Cut chart releases with \`task release -- --chart\` so the two stay in step."
            exit 1
          fi

      - name: lint the chart
        run: helm lint "$CHART_DIR" -f "$CHART_DIR/values-lint.yaml"

      - name: log in to GHCR
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_PASSWORD"

      - name: package and push the chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # appVersion stays as declared in Chart.yaml (the app image the chart targets);
          # the tag only sets the chart package version.
          helm package "$CHART_DIR" --version "$VERSION"
          helm push "oas2mcp-${VERSION}.tgz" "$OCI_REPO"
