name: docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - logo.svg
      - mise.toml
      - mise.lock
      - Taskfile.yml
      - .github/workflows/docs.yaml
  pull_request:
    paths:
      - docs/**
      - logo.svg
      - mise.toml
      - mise.lock
      - Taskfile.yml
      - .github/workflows/docs.yaml
  # Dispatched on `main` by `release`: a new release changes which version the
  # root serves.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every release tag, whose content each version is built from.
          fetch-depth: 0
          persist-credentials: false

      - name: install the tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.10
          cache: false
          install_args: node task

      # Also fails on a broken internal link or anchor, in any version.
      - name: build every version of the site
        run: task docs

      - name: upload the site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: deploy
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
