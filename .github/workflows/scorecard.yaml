name: scorecard

# `publish_results` sends the signed result to the Scorecard API behind the
# README badge. The API rejects a run whose workflow has a top-level `env` or
# `defaults`, a workflow-level write permission, or, in `analysis`, an `env`, a
# `run:` step or an action outside its allowlist.
on:
  push:
    branches:
      - main
  # GitHub disables scheduled workflows after 60 days without activity on the
  # repository: re-enable from the Actions tab if it goes quiet.
  schedule:
    - cron: "37 5 * * 1"
  branch_protection_rule:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: run the Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: upload the results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: results.sarif
          category: scorecard
