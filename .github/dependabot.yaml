version: 2
updates:
  # Keep the SHA-pinned action references (and their tag comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

  # Also drives the hadolint binary CI installs, which reads this `rev`.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
