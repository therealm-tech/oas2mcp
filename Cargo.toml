[package]
name = "oas2mcp"
version = "1.0.2"
edition = "2024"
description = "Load an OpenAPI document at startup and expose it as a Model Context Protocol (MCP) server over stdio, SSE, or Streamable HTTP."
authors = ["Guillaume Leroy <gleroy@therealm.tech>"]
repository = "https://github.com/therealm-tech/oas2mcp"
license = "Apache-2.0"
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "io-std",
    "fs",
    "net",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "query",
    "rustls",
    "charset",
    "http2",
] }
# The Mozilla roots every outbound client trusts, beside `--ca-cert`; see
# `http::client`.
webpki-root-certs = "1"
indexmap = { version = "2", features = ["serde"] }
# `jsonwebtoken` 10 moved to pluggable crypto backends and no longer picks one
# implicitly: exactly one of `rust_crypto` and `aws_lc_rs` must be enabled, or
# every verification call panics at runtime. `rust_crypto` is pure Rust — no C
# toolchain, no build-script surprises — and covers every algorithm reachable
# from `auth::algorithms_for` (RS*, PS*, ES256/384, EdDSA).
# `use_pem` reads the RFC 7523 client signing key from its PEM file
# (`EncodingKey::from_{rsa,ec,ed}_pem`), and is also what the auth unit tests
# sign with.
jsonwebtoken = { version = "12.0", default-features = false, features = [
    "rust_crypto",
    "use_pem",
] }
arc-swap = "1"
humantime = "2"
regex = "1"
http = "1"
# `Body::size_hint`, so the access log only ever buffers a response whose length
# is known and small (a rejection reason) and never touches a streamed one.
http-body = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object keys in document order. OpenAPI schemas are
# passed through to MCP clients as raw JSON, so without it every `properties`
# map would be re-emitted alphabetically instead of in the order the API author
# wrote it — harmless to a validator, but worse to read for the model on the
# other end of the tool call.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
url = "2"
anyhow = "1"
base64 = "0.23.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33.0"
opentelemetry_sdk = { version = "0.33.0", features = ["metrics"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
    "metrics",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
opentelemetry-prometheus = "0.33.0"
prometheus = { version = "0.14.0", default-features = false }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
# `ServiceExt::oneshot`, to drive an axum router in a test without a socket.
tower = { version = "0.5", features = ["util"] }
# An in-process MCP client, to check what a connected client receives.
rmcp = { version = "3.1", features = ["client"] }
# Throwaway signing keys generated by the tests (`test_keys`), so none is committed.
rsa = "0.10"
p256 = { version = "0.14", features = ["getrandom"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
# A throwaway CA and a TLS server signed by it, to check what `http::client` trusts.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tokio-rustls = "0.26"

# The unit tests generate a 3072-bit RSA key at startup; unoptimised, the prime
# search alone takes ~3 s of every `cargo test`, against ~0.1 s at opt-level 3.
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3
