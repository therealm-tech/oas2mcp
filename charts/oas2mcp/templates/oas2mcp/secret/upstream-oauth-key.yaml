{{- if include "oas2mcp.upstreamOauthPrivateKeyGenerateSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oas2mcp.upstreamOauthPrivateKeySecretName" . }}
  labels:
    {{- include "oas2mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PKCS#8 PEM private key signing the upstream RFC 7523 client assertions,
  # mounted and pointed at via UPSTREAM_OAUTH_PRIVATE_KEY_FILE.
  {{ include "oas2mcp.upstreamOauthPrivateKeyKey" . }}: {{ .Values.oas2mcp.upstream.oauth.privateKey.inline | quote }}
{{- end }}
