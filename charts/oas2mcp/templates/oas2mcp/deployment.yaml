{{- if and (not .Values.oas2mcp.openapi.url) (not .Values.oas2mcp.openapi.inline) }}
{{- fail "oas2mcp.openapi.url or oas2mcp.openapi.inline must be set" }}
{{- end }}
{{- include "oas2mcp.caCertsValidate" . }}
{{- include "oas2mcp.oauthClientAuthValidate" . }}
{{- include "oas2mcp.upstreamOauthClientAuthValidate" . }}
{{- include "oas2mcp.upstreamDelegationValidate" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oas2mcp.fullname" . }}
  labels:
    {{- include "oas2mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.oas2mcp.replicaCount }}
  revisionHistoryLimit: {{ .Values.oas2mcp.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "oas2mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oas2mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.oas2mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.oas2mcp.openapi.inline }}
        checksum/openapi: {{ .Values.oas2mcp.openapi.inline | sha256sum }}
        {{- end }}
        {{- if and (gt (len .Values.oas2mcp.upstream.headers) 0) (not .Values.oas2mcp.upstream.existingSecret.name) }}
        checksum/upstream: {{ join "\n" .Values.oas2mcp.upstream.headers | sha256sum }}
        {{- end }}
        {{- if and (not .Values.oas2mcp.openapi.inline) (gt (len .Values.oas2mcp.openapi.headers) 0) (not .Values.oas2mcp.openapi.existingSecret.name) }}
        checksum/openapi-headers: {{ join "\n" .Values.oas2mcp.openapi.headers | sha256sum }}
        {{- end }}
        {{- if and (not .Values.oas2mcp.openapi.inline) .Values.oas2mcp.openapi.oauth.clientSecret (not .Values.oas2mcp.openapi.oauth.existingSecret.name) }}
        checksum/openapi-oauth: {{ .Values.oas2mcp.openapi.oauth.clientSecret | sha256sum }}
        {{- end }}
        {{- if and (not .Values.oas2mcp.openapi.inline) (include "oas2mcp.oauthPrivateKeyGenerateSecret" .) }}
        checksum/openapi-oauth-key: {{ .Values.oas2mcp.openapi.oauth.privateKey.inline | sha256sum }}
        {{- end }}
        {{- if and .Values.oas2mcp.upstream.oauth.clientSecret (not .Values.oas2mcp.upstream.oauth.existingSecret.name) }}
        checksum/upstream-oauth: {{ .Values.oas2mcp.upstream.oauth.clientSecret | sha256sum }}
        {{- end }}
        {{- if include "oas2mcp.upstreamOauthPrivateKeyGenerateSecret" . }}
        checksum/upstream-oauth-key: {{ .Values.oas2mcp.upstream.oauth.privateKey.inline | sha256sum }}
        {{- end }}
        {{- if include "oas2mcp.caCertsGenerateSecret" . }}
        checksum/ca-certs: {{ .Values.oas2mcp.caCerts.inline | sha256sum }}
        {{- end }}
        {{- with .Values.oas2mcp.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.oas2mcp.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "oas2mcp.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.oas2mcp.podSecurityContext | nindent 8 }}
      containers:
        - name: oas2mcp
          image: {{ include "oas2mcp.image" . | quote }}
          imagePullPolicy: {{ .Values.oas2mcp.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.oas2mcp.securityContext | nindent 12 }}
          args:
            - --transport
            - {{ .Values.oas2mcp.transport | quote }}
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:{{ .Values.oas2mcp.service.port }}"
            - name: RUST_LOG
              value: {{ .Values.oas2mcp.logFilter | quote }}
            {{- with .Values.oas2mcp.allowedHosts }}
            - name: ALLOWED_HOSTS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- if .Values.oas2mcp.streamResponses }}
            - name: STREAM_RESPONSES
              value: "true"
            {{- end }}
            {{- if .Values.oas2mcp.openapi.inline }}
            - name: OPENAPI_FILE
              value: /etc/oas2mcp/openapi.yaml
            {{- else }}
            - name: OPENAPI_URL
              value: {{ .Values.oas2mcp.openapi.url | quote }}
            {{- if or .Values.oas2mcp.openapi.existingSecret.name (gt (len .Values.oas2mcp.openapi.headers) 0) }}
            - name: OPENAPI_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "oas2mcp.openapiSecretName" . }}
                  key: {{ include "oas2mcp.openapiSecretKey" . }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.oauth.tokenUrl }}
            - name: OPENAPI_OAUTH_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.oauth.clientId }}
            - name: OPENAPI_OAUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.oas2mcp.openapi.oauth.existingSecret.name .Values.oas2mcp.openapi.oauth.clientSecret }}
            - name: OPENAPI_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "oas2mcp.oauthSecretName" . }}
                  key: {{ include "oas2mcp.oauthSecretKey" . }}
            {{- end }}
            {{- if include "oas2mcp.oauthPrivateKeyEnabled" . }}
            - name: OPENAPI_OAUTH_PRIVATE_KEY_FILE
              value: /etc/oas2mcp-oauth-key/{{ include "oas2mcp.oauthPrivateKeyKey" . }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.oauth.privateKey.keyId }}
            - name: OPENAPI_OAUTH_KEY_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.oauth.privateKey.signingAlg }}
            - name: OPENAPI_OAUTH_SIGNING_ALG
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.oauth.privateKey.assertionAudience }}
            - name: OPENAPI_OAUTH_ASSERTION_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.oauth.privateKey.assertionLifetime }}
            - name: OPENAPI_OAUTH_ASSERTION_LIFETIME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.oauth.scopes }}
            - name: OPENAPI_OAUTH_SCOPES
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.oauth.audience }}
            - name: OPENAPI_OAUTH_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.openapi.reloadEvery }}
            - name: RELOAD_EVERY
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.oas2mcp.baseUrl }}
            - name: BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.oas2mcp.upstream.existingSecret.name (gt (len .Values.oas2mcp.upstream.headers) 0) }}
            - name: UPSTREAM_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "oas2mcp.upstreamSecretName" . }}
                  key: {{ include "oas2mcp.upstreamSecretKey" . }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.forwardHeaders }}
            - name: FORWARD_HEADERS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.tokenUrl }}
            - name: UPSTREAM_OAUTH_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.clientId }}
            - name: UPSTREAM_OAUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.oas2mcp.upstream.oauth.existingSecret.name .Values.oas2mcp.upstream.oauth.clientSecret }}
            - name: UPSTREAM_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "oas2mcp.upstreamOauthSecretName" . }}
                  key: {{ include "oas2mcp.upstreamOauthSecretKey" . }}
            {{- end }}
            {{- if include "oas2mcp.upstreamOauthPrivateKeyEnabled" . }}
            - name: UPSTREAM_OAUTH_PRIVATE_KEY_FILE
              value: /etc/oas2mcp-upstream-oauth-key/{{ include "oas2mcp.upstreamOauthPrivateKeyKey" . }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.privateKey.keyId }}
            - name: UPSTREAM_OAUTH_KEY_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.privateKey.signingAlg }}
            - name: UPSTREAM_OAUTH_SIGNING_ALG
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.privateKey.assertionAudience }}
            - name: UPSTREAM_OAUTH_ASSERTION_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.privateKey.assertionLifetime }}
            - name: UPSTREAM_OAUTH_ASSERTION_LIFETIME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.grant }}
            - name: UPSTREAM_OAUTH_GRANT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.assertion }}
            - name: UPSTREAM_OAUTH_ASSERTION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.issuer }}
            - name: UPSTREAM_OAUTH_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.subject }}
            - name: UPSTREAM_OAUTH_SUBJECT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.subjectClaim }}
            - name: UPSTREAM_OAUTH_SUBJECT_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.scopes }}
            - name: UPSTREAM_OAUTH_SCOPES
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.upstream.oauth.audience }}
            - name: UPSTREAM_OAUTH_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.operations.include }}
            - name: INCLUDE_OPERATIONS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.operations.exclude }}
            - name: EXCLUDE_OPERATIONS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.operations.includeRegex }}
            - name: INCLUDE_OPERATIONS_REGEX
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.operations.excludeRegex }}
            - name: EXCLUDE_OPERATIONS_REGEX
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.operations.includeTags }}
            - name: INCLUDE_TAGS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.operations.excludeTags }}
            - name: EXCLUDE_TAGS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.operations.rename }}
            - name: RENAME_OPERATIONS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.operations.maxNameLen }}
            - name: MAX_NAME_LEN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.auth.roleMapper }}
            - name: OAUTH_ROLE_MAPPER
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.auth.roleClaim }}
            - name: OAUTH_ROLE_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.auth.expectedAudiences }}
            - name: OAUTH_EXPECTED_AUDIENCES
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.auth.expectedIssuers }}
            - name: OAUTH_EXPECTED_ISSUERS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.auth.clockSkew }}
            - name: OAUTH_CLOCK_SKEW
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.auth.traceClaims }}
            - name: TRACE_CLAIMS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.auth.jwks.url }}
            - name: OAUTH_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.auth.jwks.file }}
            - name: OAUTH_JWKS_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.metrics.otlp.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oas2mcp.metrics.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.oas2mcp.metrics.prometheus.enabled }}
            - name: METRICS_ADDR
              value: "0.0.0.0:{{ .Values.oas2mcp.metrics.prometheus.port }}"
            {{- end }}
            {{- if include "oas2mcp.caCertsEnabled" . }}
            - name: CA_CERT_FILE
              value: /etc/oas2mcp-ca-certs/{{ include "oas2mcp.caCertsKey" . }}
            {{- end }}
            {{- with .Values.oas2mcp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.oas2mcp.service.port }}
              protocol: TCP
            {{- if .Values.oas2mcp.metrics.prometheus.enabled }}
            - name: metrics
              containerPort: {{ .Values.oas2mcp.metrics.prometheus.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.oas2mcp.resources | nindent 12 }}
          {{- if or .Values.oas2mcp.openapi.inline (include "oas2mcp.caCertsEnabled" .) (include "oas2mcp.oauthPrivateKeyEnabled" .) (include "oas2mcp.upstreamOauthPrivateKeyEnabled" .) .Values.oas2mcp.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.oas2mcp.openapi.inline }}
            - name: openapi
              mountPath: /etc/oas2mcp
              readOnly: true
            {{- end }}
            {{- if include "oas2mcp.caCertsEnabled" . }}
            - name: ca-certs
              mountPath: /etc/oas2mcp-ca-certs
              readOnly: true
            {{- end }}
            {{- if include "oas2mcp.oauthPrivateKeyEnabled" . }}
            - name: oauth-private-key
              mountPath: /etc/oas2mcp-oauth-key
              readOnly: true
            {{- end }}
            {{- if include "oas2mcp.upstreamOauthPrivateKeyEnabled" . }}
            - name: upstream-oauth-private-key
              mountPath: /etc/oas2mcp-upstream-oauth-key
              readOnly: true
            {{- end }}
            {{- with .Values.oas2mcp.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.oas2mcp.openapi.inline (include "oas2mcp.caCertsEnabled" .) (include "oas2mcp.oauthPrivateKeyEnabled" .) (include "oas2mcp.upstreamOauthPrivateKeyEnabled" .) .Values.oas2mcp.extraVolumes }}
      volumes:
        {{- if .Values.oas2mcp.openapi.inline }}
        - name: openapi
          configMap:
            name: {{ include "oas2mcp.fullname" . }}-openapi
        {{- end }}
        {{- if include "oas2mcp.caCertsEnabled" . }}
        - name: ca-certs
          {{- if include "oas2mcp.caCertsFromConfigMap" . }}
          configMap:
            name: {{ .Values.oas2mcp.caCerts.existing.name }}
          {{- else }}
          secret:
            secretName: {{ include "oas2mcp.caCertsSecretName" . }}
          {{- end }}
        {{- end }}
        {{- if include "oas2mcp.oauthPrivateKeyEnabled" . }}
        - name: oauth-private-key
          secret:
            secretName: {{ include "oas2mcp.oauthPrivateKeySecretName" . }}
            # Root-owned and readable through fsGroup: 0400 would leave the
            # non-root container unable to read its own signing key.
            defaultMode: 0440
        {{- end }}
        {{- if include "oas2mcp.upstreamOauthPrivateKeyEnabled" . }}
        - name: upstream-oauth-private-key
          secret:
            secretName: {{ include "oas2mcp.upstreamOauthPrivateKeySecretName" . }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.oas2mcp.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.oas2mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oas2mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oas2mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
