# -- oas2mcp server: deploys the OpenAPI→MCP proxy as an HTTP MCP endpoint.
oas2mcp:
  # -- Number of server replicas.
  replicaCount: 1

  # -- Number of old ReplicaSets the Deployment keeps for rollback.
  revisionHistoryLimit: 3

  image:
    # -- Container image repository.
    repository: ghcr.io/therealm-tech/oas2mcp
    # -- Image pull policy.
    pullPolicy: IfNotPresent
    # -- (string) Image tag. Unset → the chart `appVersion`.
    tag: ~

  # -- (list) Image pull secrets for private registries.
  imagePullSecrets: []

  openapi:
    # -- (string) URL of the OpenAPI document fetched at startup. Mutually exclusive with `inline`.
    url: ~
    # -- (string) Inline OpenAPI document (JSON or YAML). Stored in a ConfigMap and mounted; takes precedence over `url`.
    inline: ~
    # -- (list) `Name: Value` headers sent when fetching `url` (e.g. for a private document). Stored in a Secret. Ignored with `inline`.
    headers: []
    existingSecret:
      # -- (string) Name of a pre-existing Secret holding the document-fetch headers. Set → takes precedence over `headers`.
      name: ~
      # -- Key in that Secret holding the newline-separated `Name: Value` headers.
      key: OPENAPI_HEADERS
    # -- (string) Re-fetch `url` on this interval and rebuild the tool set (e.g. `30s`, `5m`, `1h`). Unset → load once at startup. Ignored with `inline`.
    reloadEvery: ~
    oauth:
      # -- (string) OAuth2 `client_credentials` token endpoint. Set → the document fetch authenticates with an auto-refreshed bearer token (best paired with `reloadEvery`). Ignored with `inline`.
      tokenUrl: ~
      # -- (string) OAuth2 client ID.
      clientId: ~
      # -- (string) OAuth2 client secret, sent over HTTP Basic. Stored in a Secret. Ignored when `existingSecret.name` is set. Mutually exclusive with `privateKey`.
      clientSecret: ~
      existingSecret:
        # -- (string) Name of a pre-existing Secret holding the client secret. Set → takes precedence over `clientSecret`.
        name: ~
        # -- Key in that Secret holding the client secret.
        key: OPENAPI_OAUTH_CLIENT_SECRET
      # -- (list) OAuth2 scopes requested for the token.
      scopes: []
      # -- (string) OAuth2 `audience` parameter, when the provider requires it (e.g. Auth0).
      audience: ~
      # -- Authenticate the client with a JWT assertion it signs per request (`private_key_jwt`, RFC 7523 §2.2) instead of a shared secret — for providers that will not issue one. Register the **public** half of the key with the provider. Mutually exclusive with `clientSecret`/`existingSecret`; setting both fails the render.
      privateKey:
        # -- (string) Inline PKCS#8 PEM private key. Stored in a Secret and mounted read-only at mode `0440` (root-owned, readable via `fsGroup` — `0400` would be unreadable by the non-root container). Ignored when `existingSecret.name` is set.
        inline: ~
        existingSecret:
          # -- (string) Name of a pre-existing Secret holding the PEM private key. Set → takes precedence over `inline`.
          name: ~
          # -- Key in that Secret holding the PEM private key. Doubles as the mounted file name.
          key: client-key.pem
        # -- (string) `kid` header put on the client assertion, when the provider has several keys registered for this client. Maps to `OPENAPI_OAUTH_KEY_ID`.
        keyId: ~
        # -- (string) Assertion signature algorithm — `rs256`/`rs384`/`rs512`, `ps256`/`ps384`/`ps512`, `es256`/`es384`, `eddsa`. Must match the key type. Unset → the binary default (`rs256`). Maps to `OPENAPI_OAUTH_SIGNING_ALG`.
        signingAlg: ~
        # -- (string) `aud` claim of the client assertion. Unset → the token endpoint URL, which is what most providers expect; set it when yours wants its issuer identifier instead. Maps to `OPENAPI_OAUTH_ASSERTION_AUDIENCE`.
        assertionAudience: ~
        # -- (string) How long a client assertion stays valid (e.g. `30s`, `2m`). Unset → the binary default (`60s`). Maps to `OPENAPI_OAUTH_ASSERTION_LIFETIME`.
        assertionLifetime: ~

  # -- Filter which OpenAPI operations are exposed as tools. An operation is kept if it matches any `include`/`includeRegex`/`includeTags` allowlist (or all allowlists are empty), then dropped if it matches any `exclude`/`excludeRegex`/`excludeTags`. Use it to cut a large API down to a usable tool set.
  operations:
    # -- (list) Glob allowlist on the operation name (operationId, or `<method>_<path>`); `*` and `?` supported. Maps to `INCLUDE_OPERATIONS`.
    include: []
    # -- (list) Glob denylist on the operation name; takes precedence over the allowlist. Maps to `EXCLUDE_OPERATIONS`.
    exclude: []
    # -- (list) Regex allowlist on the operation name (e.g. `^(get|post)ApiV4Projects`). Maps to `INCLUDE_OPERATIONS_REGEX`.
    includeRegex: []
    # -- (list) Regex denylist on the operation name; takes precedence over the allowlist. Maps to `EXCLUDE_OPERATIONS_REGEX`.
    excludeRegex: []
    # -- (list) Only expose operations carrying one of these OpenAPI tags (case-insensitive). Maps to `INCLUDE_TAGS`.
    includeTags: []
    # -- (list) Drop operations carrying one of these OpenAPI tags (case-insensitive); takes precedence over the allowlist. Maps to `EXCLUDE_TAGS`.
    excludeTags: []

  # -- Restrict the tool set per caller by matching the roles in their verified JWT against tool-name regexes. Requires `transport: streamable-http` (the only transport exposing the client's JWT). A caller with no valid token, or whose roles match nothing, sees and can call no tools.
  auth:
    # -- (list) Role→tool mappings as `role:tool_name_regex` (e.g. `admin:.*`, `reader:^get`). A tool is visible if any of the caller's roles maps to a regex matching the tool name. Set → enables JWT verification, which requires `jwks.url` or `jwks.file`. Maps to `OAUTH_ROLE_MAPPER`.
    roleMapper: []
    # -- (string) JWT claim listing the caller's roles (an array or a whitespace-separated string). Unset → the binary default (`roles`). Maps to `OAUTH_ROLE_CLAIM`.
    roleClaim: ~
    # -- (list) Audiences the incoming JWT's `aud` must match; the token passes if any matches. **Set this**: unset, any JWT the JWKS can verify is accepted, including one your provider issued for a different service. Setting it also makes `aud` mandatory. Maps to `OAUTH_EXPECTED_AUDIENCES`.
    expectedAudiences: []
    # -- (list) Issuers the incoming JWT's `iss` must match. Defence in depth next to the JWKS — it catches a key shared across logical issuers (a staging and a production realm, say). Setting it also makes `iss` mandatory. Maps to `OAUTH_EXPECTED_ISSUERS`.
    expectedIssuers: []
    # -- (string) Clock skew tolerated on the incoming JWT's `exp`/`nbf` (e.g. `30s`, `2m`). Unset → the binary default (`60s`). Raise it when tokens are rejected intermittently because the provider's clock and this server's disagree. Maps to `OAUTH_CLOCK_SKEW`.
    clockSkew: ~
    # -- (list) JWT claim names copied into the per-call tracing log as a `jwt.claims` field (e.g. `sub`, `email`, `tenant_id`), for observability. Logged only, never a metric label. Needs `roleMapper` (claims come from the verified JWT). Defaults to `[sub]`; set `[]` to disable. Maps to `TRACE_CLAIMS`.
    traceClaims:
      - sub
    jwks:
      # -- (string) URL of a JWKS document, fetched at startup, whose keys verify incoming JWT signatures. Mutually exclusive with `file`. One of the two is required when `roleMapper` is set. Maps to `OAUTH_JWKS_URL`.
      url: ~
      # -- (string) Path to a JWKS document on disk (mount it via `extraVolumes`/`extraVolumeMounts`). Mutually exclusive with `url`. Maps to `OAUTH_JWKS_FILE`.
      file: ~

  # -- Extra CA certificates to trust for every outbound TLS connection (upstream API, document fetch, OAuth token endpoint, JWKS). Added on top of the built-in public roots — supply only your private/corporate CA. Mounted as a file and pointed at via `CA_CERT_FILE`.
  caCerts:
    # -- (string) Inline PEM bundle of one or more CA certificates. Stored in a Secret and mounted. Ignored when `existing.name` is set.
    inline: ~
    # -- Mount the PEM bundle from a resource you already manage, instead of `inline`. Takes precedence over `inline` when `name` is set.
    existing:
      # -- (string) Kind of the resource holding the bundle: `ConfigMap` (the natural home for public CA certs) or `Secret`.
      kind: ConfigMap
      # -- (string) Name of the resource. Set → mounts the bundle from it instead of generating a Secret from `inline`.
      name: ~
      # -- Key in the resource holding the PEM bundle (also the mounted file name).
      key: ca-certificates.crt

  # -- (string) Upstream API base URL the tool calls are proxied to. Unset → taken from the document `servers`.
  baseUrl: ~

  # -- MCP transport to expose. One of `streamable-http`, `sse`. (`stdio` makes no sense for a long-running Deployment.)
  transport: streamable-http

  # -- (list) Hostnames (or `host:port`) accepted in the inbound `Host` header, checked to stop DNS rebinding. An entry without a port matches any port; `*` accepts any host. Empty → any host is accepted, because the pod binds `0.0.0.0` and cannot guess the Service/Ingress name clients use. Set it to those names to check them (e.g. `[oas2mcp.example.com]`). Only affects `transport: streamable-http`. Maps to `ALLOWED_HOSTS`.
  allowedHosts: []

  # -- Reply on `streamable-http` with an SSE flow and stateful sessions. Set to `false` when the MCP server sits behind a proxy (e.g. Envoy AI Gateway) that can't parse the SSE priming event — that switches it to single `application/json` replies (stateless). Only affects `transport: streamable-http`.
  streamResponses: true

  upstream:
    # -- (list) Static `Name: Value` headers added to every upstream request (e.g. `Authorization: Bearer ...`). Stored in a Secret.
    headers: []
    existingSecret:
      # -- (string) Name of a pre-existing Secret holding the upstream headers. Set → takes precedence over `headers`.
      name: ~
      # -- Key in that Secret holding the newline-separated `Name: Value` headers.
      key: UPSTREAM_HEADERS
    # -- (list) Names of incoming MCP-client request headers forwarded verbatim to the upstream API (e.g. `Authorization`). Per-call, not static; requires `transport: streamable-http`.
    forwardHeaders: []
    # -- Obtain the upstream `Authorization: Bearer` from an OAuth2 `client_credentials` grant, auto-refreshed before expiry, instead of a static token in `headers`. Configured independently of `openapi.oauth` — the document and the API may sit behind different providers. When a token is configured it outranks a forwarded `Authorization` but not a static one in `headers`.
    oauth:
      # -- (string) OAuth2 `client_credentials` token endpoint for upstream calls. Set → enables the whole block; requires `clientId` plus one credential.
      tokenUrl: ~
      # -- (string) OAuth2 client ID.
      clientId: ~
      # -- (string) OAuth2 client secret, sent over HTTP Basic. Stored in a Secret. Ignored when `existingSecret.name` is set. Mutually exclusive with `privateKey`.
      clientSecret: ~
      existingSecret:
        # -- (string) Name of a pre-existing Secret holding the client secret. Set → takes precedence over `clientSecret`.
        name: ~
        # -- Key in that Secret holding the client secret.
        key: UPSTREAM_OAUTH_CLIENT_SECRET
      # -- (list) OAuth2 scopes requested for the upstream token.
      scopes: []
      # -- (string) OAuth2 `audience` parameter, when the provider requires it (e.g. Auth0).
      audience: ~
      # -- (string) Which grant obtains the token: `client-credentials` (the default) gets one token for the server itself, shared by every caller; `jwt-bearer` (RFC 7523 §2.1) obtains one **per caller**, so the upstream API sees who is really acting. Unset → the binary default. Maps to `UPSTREAM_OAUTH_GRANT`.
      grant: ~
      # -- (string) Who signs the `jwt-bearer` assertion: `self-signed` (the default, needs `privateKey`) or `caller` (relays the caller's own verified JWT, needs no key but requires their token's `aud` to be the authorization server). Maps to `UPSTREAM_OAUTH_ASSERTION`.
      assertion: ~
      # -- (string) `iss` of the `jwt-bearer` assertion, identifying oas2mcp to the provider. Unset → `clientId`. Maps to `UPSTREAM_OAUTH_ISSUER`.
      issuer: ~
      # -- (string) Fixed `sub` for the `jwt-bearer` assertion — a named service account, the same for every caller. Mutually exclusive with `subjectClaim`. Maps to `UPSTREAM_OAUTH_SUBJECT`.
      subject: ~
      # -- (string) Claim of the **caller's** verified JWT whose value becomes the assertion's `sub` — i.e. per-caller delegation. Unset → the binary default (`sub`); many providers need `email` instead. Requires `auth.roleMapper` with a JWKS and `transport: streamable-http`; the server refuses to start otherwise. Maps to `UPSTREAM_OAUTH_SUBJECT_CLAIM`.
      subjectClaim: ~
      # -- Authenticate with a JWT assertion signed per request (`private_key_jwt`, RFC 7523 §2.2) instead of a shared secret. Also signs the `jwt-bearer` grant assertion when `grant: jwt-bearer` with a `self-signed` assertion — one key, loaded once. Mutually exclusive with `clientSecret`/`existingSecret`; setting both fails the render.
      privateKey:
        # -- (string) Inline PKCS#8 PEM private key. Stored in a Secret and mounted read-only at mode `0440`. Ignored when `existingSecret.name` is set.
        inline: ~
        existingSecret:
          # -- (string) Name of a pre-existing Secret holding the PEM private key. Set → takes precedence over `inline`.
          name: ~
          # -- Key in that Secret holding the PEM private key. Doubles as the mounted file name.
          key: upstream-client-key.pem
        # -- (string) `kid` header put on the client assertion. Maps to `UPSTREAM_OAUTH_KEY_ID`.
        keyId: ~
        # -- (string) Assertion signature algorithm — `rs256`/`rs384`/`rs512`, `ps256`/`ps384`/`ps512`, `es256`/`es384`, `eddsa`. Must match the key type. Unset → the binary default (`rs256`). Maps to `UPSTREAM_OAUTH_SIGNING_ALG`.
        signingAlg: ~
        # -- (string) `aud` claim of the client assertion. Unset → the token endpoint URL. Maps to `UPSTREAM_OAUTH_ASSERTION_AUDIENCE`.
        assertionAudience: ~
        # -- (string) How long a client assertion stays valid (e.g. `30s`). Unset → the binary default (`60s`). Maps to `UPSTREAM_OAUTH_ASSERTION_LIFETIME`.
        assertionLifetime: ~

  # -- `tracing` filter directive, mapped to `RUST_LOG`.
  logFilter: info

  service:
    # -- Service type.
    type: ClusterIP
    # -- Service port (also the container listen port).
    port: 8000

  # -- Tool-call metrics (OpenTelemetry). Export over OTLP and/or a Prometheus `/metrics` endpoint; both are independent.
  metrics:
    otlp:
      # -- (string) Base OTLP endpoint to push metrics to over HTTP (e.g. `http://otel-collector:4318`); `/v1/metrics` is appended. Unset → no OTLP export. Maps to `OTEL_EXPORTER_OTLP_ENDPOINT`.
      endpoint: ~
    # -- (string) `service.name` reported on exported metrics. Unset → the binary default (`oas2mcp`). Maps to `OTEL_SERVICE_NAME`.
    serviceName: ~
    prometheus:
      # -- Serve a Prometheus `/metrics` endpoint on a dedicated port and Service port. Required by the ServiceMonitor below.
      enabled: false
      # -- Port the Prometheus `/metrics` endpoint listens on (container and Service).
      port: 9090
      serviceMonitor:
        # -- Create a Prometheus Operator ServiceMonitor scraping `/metrics`. Requires `prometheus.enabled` and the `monitoring.coreos.com` CRD.
        enabled: false
        # -- (string) Scrape interval (e.g. `30s`). Unset → the Prometheus default.
        interval: ~
        # -- (string) Per-scrape timeout (e.g. `10s`). Unset → the Prometheus default.
        scrapeTimeout: ~
        # -- (object) Extra labels on the ServiceMonitor so your Prometheus instance selects it (e.g. `release: kube-prometheus-stack`).
        labels: {}
        # -- (list) Prometheus `relabelings` applied to scraped targets before ingestion.
        relabelings: []
        # -- (list) Prometheus `metricRelabelings` applied to scraped samples before ingestion.
        metricRelabelings: []

  ingress:
    # -- Create an Ingress for the HTTP transport.
    enabled: false
    # -- (string) Ingress class name.
    className: ~
    # -- (object) Ingress annotations.
    annotations: {}
    # -- Host the Ingress routes from.
    host: oas2mcp.example.com
    # -- (string) Name of a TLS Secret for the host. Unset → no TLS block.
    tlsSecret: ~

  serviceAccount:
    # -- Create a dedicated ServiceAccount for the server.
    create: true
    # -- (string) ServiceAccount name. Unset → generated from the release name.
    name: ~
    # -- (object) Annotations added to the ServiceAccount.
    annotations: {}

  # -- (object) Annotations added to the pod.
  podAnnotations: {}
  # -- (object) Extra labels added to the pod.
  podLabels: {}

  # -- Pod-level security context (restricted Pod Security Standard).
  podSecurityContext:
    # -- Forbid running as root.
    runAsNonRoot: true
    # -- UID to run every container as.
    runAsUser: 1000
    # -- GID to run every container as.
    runAsGroup: 1000
    # -- Owning group for mounted volumes.
    fsGroup: 1000
    seccompProfile:
      # -- Seccomp profile applied to the pod.
      type: RuntimeDefault

  # -- Container-level security context (restricted Pod Security Standard).
  securityContext:
    # -- Disallow privilege escalation.
    allowPrivilegeEscalation: false
    # -- Mount the root filesystem read-only.
    readOnlyRootFilesystem: true
    capabilities:
      # -- Linux capabilities dropped from the container.
      drop:
        - ALL

  # -- Compute resources. CPU has a request but no limit (compressible); memory and ephemeral storage are capped.
  resources:
    requests:
      # -- CPU request.
      cpu: 50m
      # -- Memory request.
      memory: 64Mi
      # -- Ephemeral storage request.
      ephemeral-storage: 64Mi
    limits:
      # -- Memory limit.
      memory: 128Mi
      # -- Ephemeral storage limit.
      ephemeral-storage: 256Mi

  # -- (object) Node selector for pod scheduling.
  nodeSelector: {}
  # -- (list) Tolerations for pod scheduling.
  tolerations: []
  # -- (object) Affinity rules for pod scheduling.
  affinity: {}

  # -- Extra environment variables injected into the container.
  extraEnv: []
  # -- Extra volumes added to the pod.
  extraVolumes: []
  # -- Extra volume mounts added to the container.
  extraVolumeMounts: []
