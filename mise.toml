min_version = "2026.11.10"

[tools]
actionlint = "1.7.12"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.2"
# `scripts/release.sh` writes the version with `cargo set-version`.
"cargo:cargo-edit" = "0.13.14"
# Lets mise install cargo-edit as a prebuilt binary instead of compiling it.
cargo-binstall = "1.28.0"
hadolint = "2.15.1"
helm = "4.3.2"
helm-docs = "1.14.2"
node = "24.22.3"
pre-commit = "4.7.0"
python = "3.15.2"
rust = { version = "1.100.0", components = [
  "rustfmt",
  "clippy",
  "llvm-tools",
], profile = "minimal" }
# actionlint runs it on the `run:` scripts; the pre-commit hook ships its own.
shellcheck = "0.11.0"
task = "3.54.0"
# The version trivy-action runs in `security` and `build`: one Trivy, one ruleset.
trivy = "0.76.2"

[settings]
lockfile = true
disable_backends = ["asdf", "vfox"]
