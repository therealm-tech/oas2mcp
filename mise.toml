min_version = "2026.11.10"

[tools]
actionlint = "1.7.12"
hadolint = "2.15.1"
helm = "4.3.2"
helm-docs = "1.14.2"
node = "24.22.3"
pre-commit = "4.7.0"
python = "3.13.18"
rust = { version = "1.100.0", components = [
  "rustfmt",
  "clippy",
], profile = "minimal" }
# actionlint runs it on the `run:` scripts; the pre-commit hook ships its own.
shellcheck = "0.11.0"
task = "3.54.0"
# The version trivy-action runs in `security` and `build`: one Trivy, one ruleset.
trivy = "0.70.0"

[settings]
lockfile = true
disable_backends = ["asdf", "vfox"]
